services:
  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-45}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-96}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      LLM_CONTEXT_LIMIT: ${LLM_CONTEXT_LIMIT:-4}
      LLM_CONTEXT_EXCERPT_CHARS: ${LLM_CONTEXT_EXCERPT_CHARS:-600}
      ENABLE_LLM_INTENT_FALLBACK: ${ENABLE_LLM_INTENT_FALLBACK:-true}
      ENABLE_DEV_EVALUATION: ${ENABLE_DEV_EVALUATION:-false}
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:-}
      RETRIEVAL_LIMIT: ${RETRIEVAL_LIMIT:-8}
      AUTO_INDEX_DOCUMENTS: ${AUTO_INDEX_DOCUMENTS:-true}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
      LOG_FILE: ${LOG_FILE:-/app/data/logs/app.jsonl}
    volumes:
      - .:/app
      - ${LOGPRESSO_DOCS_DIR:-./docs}:/app/docs:ro
      - ${LOGPRESSO_DATA_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "${UI_BIND_ADDRESS:-127.0.0.1}:8501:8501"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-45}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-96}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-4096}
      LLM_CONTEXT_LIMIT: ${LLM_CONTEXT_LIMIT:-4}
      LLM_CONTEXT_EXCERPT_CHARS: ${LLM_CONTEXT_EXCERPT_CHARS:-600}
      ENABLE_LLM_INTENT_FALLBACK: ${ENABLE_LLM_INTENT_FALLBACK:-true}
      ENABLE_DEV_EVALUATION: ${ENABLE_DEV_EVALUATION:-false}
      MANAGEMENT_API_KEY: ${MANAGEMENT_API_KEY:-}
      RETRIEVAL_LIMIT: ${RETRIEVAL_LIMIT:-8}
      AUTO_INDEX_DOCUMENTS: ${AUTO_INDEX_DOCUMENTS:-true}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8501,http://127.0.0.1:8501}
      UI_AUTH_ENABLED: ${UI_AUTH_ENABLED:-false}
      UI_USERS_JSON: ${UI_USERS_JSON:-{}}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      LOG_FILE: ${LOG_FILE:-/app/data/logs/app.jsonl}
    volumes:
      - .:/app
      - ${LOGPRESSO_DOCS_DIR:-./docs}:/app/docs:ro
      - ${LOGPRESSO_DATA_DIR:-./data}:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
