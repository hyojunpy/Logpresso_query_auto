name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -c requirements.lock -e ".[dev]"

      - name: Run tests
        env:
          LLM_PROVIDER: mock
        run: python -m pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build container image
        run: docker build --tag logpresso-query-assistant:ci .

      - name: Start compose services in mock mode
        env:
          LLM_PROVIDER: mock
          LOGPRESSO_DATA_DIR: ./.ci-data
        run: |
          mkdir -p .ci-data
          docker compose up --build --detach

      - name: Verify API and UI health checks
        run: |
          for i in $(seq 1 12); do
            curl --fail http://127.0.0.1:8000/api/v1/health && curl --fail http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Stop compose services
        if: always()
        env:
          LOGPRESSO_DATA_DIR: ./.ci-data
        run: docker compose down --volumes

  browser-test:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -c requirements.lock -e ".[dev]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Streamlit browser test
        env:
          RUN_BROWSER_TESTS: "1"
        run: python -m pytest tests/test_streamlit_browser.py -q
