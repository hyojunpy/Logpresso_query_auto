name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify internal documentation distribution approval
        env:
          DOCS_INTERNAL_DISTRIBUTION_APPROVED: ${{ vars.DOCS_INTERNAL_DISTRIBUTION_APPROVED }}
        run: |
          if [ "$DOCS_INTERNAL_DISTRIBUTION_APPROVED" != "true" ]; then
            echo "::error::Set DOCS_INTERNAL_DISTRIBUTION_APPROVED=true after recording approval for private-repository collaborator sharing of the bundled DOCX manual."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -c requirements.lock -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run offline deployment preflight
        env:
          LLM_PROVIDER: mock
        run: python scripts/check_deployment.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build release container image
        run: docker build --tag logpresso-query-assistant:${{ github.ref_name }} .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
