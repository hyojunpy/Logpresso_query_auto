name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify documentation publication approval
        env:
          DOCS_PUBLICATION_APPROVED: ${{ vars.DOCS_PUBLICATION_APPROVED }}
        run: |
          if [ "$DOCS_PUBLICATION_APPROVED" != "true" ]; then
            echo "::error::Set DOCS_PUBLICATION_APPROVED=true after confirming redistribution rights for the bundled DOCX manual."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -c requirements.lock -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run offline deployment preflight
        env:
          LLM_PROVIDER: mock
        run: python scripts/check_deployment.py

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build release container image
        run: docker build --tag logpresso-query-assistant:${{ github.ref_name }} .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
