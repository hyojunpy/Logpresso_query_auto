services:
  ui:
    expose:
      - "8501"
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      ui:
        condition: service_healthy
    ports:
      - "${UI_BIND_ADDRESS:-127.0.0.1}:8443:8443"
    environment:
      UI_BIND_ADDRESS: ${UI_BIND_ADDRESS:-127.0.0.1}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  caddy_data:
  caddy_config:
