services:
  ui:
    expose:
      - "8501"
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      ui:
        condition: service_healthy
    ports:
      - "${UI_BIND_ADDRESS:-127.0.0.1}:9443:9443"
    environment:
      UI_BIND_ADDRESS: ${UI_BIND_ADDRESS:-127.0.0.1}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://$${UI_BIND_ADDRESS}:9443/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
volumes:
  caddy_data:
  caddy_config:
