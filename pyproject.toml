[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logpresso-query-assistant"
version = "0.1.0"
description = "RAG based Logpresso natural language query assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.36",
  "pydantic>=2.7",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "playwright>=1.62"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-m", "not advanced_parser"]
markers = [
  "advanced_parser: roadmap tests for file, parser, and extended query features not in the current product scope",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:starlette.exceptions.StarletteDeprecationWarning",
]
